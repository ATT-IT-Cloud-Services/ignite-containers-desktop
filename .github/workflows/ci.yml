name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: leaseweb
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private source monorepo
        uses: actions/checkout@v4
        with:
          repository: ATT-IT-Cloud-Services/ignite-containers-monorepo
          token: ${{ secrets.MONOREPO_TOKEN }}
          path: monorepo
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: monorepo
      - name: Desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - run: cargo test --locked --manifest-path monorepo/Cargo.toml -p ignite-containers-desktop
