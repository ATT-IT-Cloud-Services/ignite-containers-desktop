name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: leaseweb
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private source monorepo
        uses: actions/checkout@v4
        with:
          repository: ATT-IT-Cloud-Services/ignite-containers-monorepo
          token: ${{ secrets.MONOREPO_TOKEN }}
          path: monorepo
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: monorepo
      - name: Desktop system dependencies
        run: |
          set -euo pipefail
          if pkg-config --exists xkbcommon wayland-client x11 xi gl gtk+-3.0; then
            echo "Desktop build dependencies are already installed."
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
              libgl1-mesa-dev libgtk-3-dev
            exit 0
          fi
          echo "::warning::Desktop GUI libraries are missing and sudo needs a password; skipping the desktop build on this runner."
          echo "SKIP_DESKTOP=1" >> "$GITHUB_ENV"
      - name: Test desktop crate
        run: |
          set -euo pipefail
          if [ "${SKIP_DESKTOP:-0}" = 1 ]; then
            echo "Skipping ignite-containers-desktop because GUI dependencies are unavailable."
            exit 0
          fi
          cargo test --locked --manifest-path monorepo/Cargo.toml -p ignite-containers-desktop
